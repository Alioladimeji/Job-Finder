<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Test</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 800px; margin: 0 auto; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; }
        pre { background: #f5f5f5; padding: 10px; border-radius: 5px; overflow-x: auto; }
        .status { margin: 10px 0; padding: 10px; border-radius: 5px; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
    <h1>Backend API Test</h1>
    <button onclick="testAPI()">Test Backend Connection</button>
    <div id="result"></div>

    <script>
        async function testAPI() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '<p>Testing...</p>';

            try {
                // Test 1: Health check
                resultDiv.innerHTML += '<h3>Test 1: Health Check</h3>';
                const healthRes = await fetch('http://localhost:8000/');
                const healthData = await healthRes.json();
                resultDiv.innerHTML += `<div class="status success">✅ Backend is online</div>`;
                resultDiv.innerHTML += `<pre>${JSON.stringify(healthData, null, 2)}</pre>`;

                // Test 2: Job search
                resultDiv.innerHTML += '<h3>Test 2: Job Search</h3>';
                const searchRes = await fetch('http://localhost:8000/api/jobs/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        keyword: 'developer',
                        location: 'Remote',
                        exclude: [],
                        modality: '',
                        time_filter: ''
                    })
                });

                const searchData = await searchRes.json();
                resultDiv.innerHTML += `<div class="status success">✅ Search returned ${searchData.total} jobs</div>`;
                resultDiv.innerHTML += `<pre>${JSON.stringify(searchData.results.slice(0, 3), null, 2)}</pre>`;

            } catch (error) {
                resultDiv.innerHTML += `<div class="status error">❌ Error: ${error.message}</div>`;
                resultDiv.innerHTML += `<p>Make sure the backend is running on port 8000</p>`;
            }
        }
    </script>
</body>
</html>
